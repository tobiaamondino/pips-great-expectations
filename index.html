/* ================= basics ================= */
let W=640;const H=360,GY=300,VH=280,OFF=80;   // world is 360 high; only y from OFF to OFF+VH is shown (bigger sprites)
const SPEED=125,JUMP=372,GRAV=950;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');

const probe=document.createElement('div');
probe.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)';

function resize(){
  const iw=window.innerWidth,ih=window.innerHeight;
  let sc=ih/VH,w=Math.round(iw/sc);
  if(w<640){sc=iw/640;w=640;}      // narrow screen (tablet): small bars top/bottom
  W=Math.min(960,w);cssScale=sc;   // wide phone: show more of the world, no side bars
  const dpr=window.devicePixelRatio||1;
  S=Math.max(1,Math.min(4,Math.round(cssScale*dpr)));
  cv.width=W*S;cv.height=VH*S;
  cv.style.width=(W*cssScale)+'px';cv.style.height=(VH*cssScale)+'px';
  const cs=getComputedStyle(probe);
  SAFE_L=Math.round((parseFloat(cs.paddingLeft)||0)/cssScale);SAFE_R=Math.round((parseFloat(cs.paddingRight)||0)/cssScale);
}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();

/* ================= audio ================= */
let AC=null,muted=false;
try{muted=localStorage.getItem('pge_muted')==='1';}catch(e){}
const muteBtn=$('#mute');
function paintMute(){muteBtn.textContent=muted?'🔇':'🔊';}
paintMute();
muteBtn.addEventListener('click',()=>{muted=!muted;paintMute();try{localStorage.setItem('pge_muted',muted?'1':'0');}catch(e){}});
const fsBtn=$('#fs'),de=document.documentElement,reqFS=de.requestFullscreen||de.webkitRequestFullscreen;
if(reqFS){
  fsBtn.style.display='block';
  fsBtn.addEventListener('click',()=>{
    if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
    else{Promise.resolve(reqFS.call(de)).then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}
  });
}
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function beep(f,d,type,vol,slide){
  if(muted||!AC)return;
  try{
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
const sfx={
  jump:()=>beep(380,.13,'square',.035,320),
  heart:()=>{beep(660,.09,'triangle',.07);setTimeout(()=>beep(990,.13,'triangle',.07),70);},
  coin:()=>beep(1250,.09,'square',.03),
  item:()=>{beep(520,.08,'triangle',.07);setTimeout(()=>beep(780,.1,'triangle',.07),60);},
  hit:()=>beep(170,.28,'sawtooth',.06,-110),
  stomp:()=>beep(230,.12,'square',.05,-130),
  win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.2,'triangle',.07),i*110)),
  good:()=>{beep(660,.1,'triangle',.07);setTimeout(()=>beep(880,.18,'triangle',.07),90);},

/* ================= input ================= */
const keys={};
let jumpHeld=false,jumpBuf=0,jumpId=null;
const stick={id:null,ox:0,oy:0,x:0,y:0};
let touchMode=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
function lpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/cssScale,y:(e.clientY-r.top)/cssScale};}
cv.addEventListener('pointerdown',e=>{
  audio();
  if(e.pointerType==='touch')touchMode=true;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const p=lpos(e);
  if(p.x<W*0.55&&stick.id===null){stick.id=e.pointerId;stick.ox=p.x;stick.oy=p.y;stick.x=0;stick.y=0;}
  else if(p.x>=W*0.55&&jumpId===null){jumpId=e.pointerId;jumpHeld=true;jumpBuf=0.14;}
  e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId===stick.id){
    const p=lpos(e);
    stick.x=Math.max(-1,Math.min(1,(p.x-stick.ox)/38));
    stick.y=Math.max(-1,Math.min(1,(p.y-stick.oy)/38));
  }
});
function release(e){
  if(e.pointerId===stick.id){stick.id=null;stick.x=0;stick.y=0;}
  if(e.pointerId===jumpId){jumpId=null;jumpHeld=false;}
}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);
cv.addEventListener('lostpointercapture',release);
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  audio();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(!keys[e.code]&&(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')){jumpBuf=0.14;}
  keys[e.code]=true;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jumpHeld=true;
  if(e.code==='KeyM')muteBtn.click();
});
addEventListener('keyup',e=>{
  keys[e.code]=false;
  if((e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')&&jumpId===null)jumpHeld=false;
});
function axis(){
  let a=0;
  if(keys.ArrowLeft||keys.KeyA)a-=1;
  if(keys.ArrowRight||keys.KeyD)a+=1;
  if(stick.id!==null){const m=Math.abs(stick.x);if(m>.2)a+=Math.sign(stick.x)*Math.min(1,(m-.2)/.5);}
  return Math.max(-1,Math.min(1,a));
}

/* ================= level building ================= */
function genBg(L){
  let seed=L.w*7+13;
  const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  L.far=[];for(let x=-100;x<L.w*.3+1000;x+=60+rnd()*80)L.far.push({x,w:60+rnd()*90,h:40+rnd()*70,r:rnd()});
  L.near=[];for(let x=-100;x<L.w*.6+1000;x+=34+rnd()*54)L.near.push({x,w:20+rnd()*40,h:18+rnd()*44,r:rnd()});
  L.stars=[];for(let i=0;i<50;i++)L.stars.push({x:rnd()*960,y:90+rnd()*130,s:rnd()});
}
function buildLevel(d){
  const L={name:d.name,theme:d.theme,w:d.w,T:THEME[d.theme],goalX:d.goal};
  L.grounds=d.ground.map(([a,b])=>({x:a,y:GY,w:b-a}));
  L.plats=d.plats.map(([x,y,w])=>({x,y,w,h:6}));
  L.haz=d.haz.map(([x,w])=>({x,y:GY-13,w,h:13}));
  L.en=d.en.map(([x0,x1,k])=>{const s=ESIZE[k];return{x:x0,y:GY-s.h,w:s.w,h:s.h,x0,x1,dir:1,k,alive:true,sp:s.sp};});
  L.items=d.items.map(([x,y,k])=>({x,y,k,got:false}));
  L.cps=d.cps;L.npcs=d.npcs.map(([x,k,lines])=>({x,k,lines}));
  L.props=d.props||[];
  relocateBeams(L);
  genBg(L);
  return L;
}
/* Beams are solid, so keep them clear of hazards and enemies and over solid ground. */
function relocateBeams(L){
  const M=36;
  const blockers=[...L.haz.map(h=>[h.x,h.x+h.w]),...L.en.map(e=>[e.x0,e.x1+e.w])];
  const free=(x,w)=>L.grounds.some(g=>x-20>=g.x&&x+w+20<=g.x+g.w)&&!blockers.some(([a,b])=>x-M<b&&x+w+M>a);
  const placed=[];
  for(const pl of L.plats){
    const its=L.items.filter(it=>it.y<pl.y&&it.y>=pl.y-32&&it.x>=pl.x-4&&it.x<=pl.x+pl.w+4);
    let best=null;
    for(let d=0;d<=600&&best===null;d+=10){
      for(const s of (d===0?[1]:[1,-1])){
        const nx=pl.x+s*d;
        if(free(nx,pl.w)&&!placed.some(q=>nx<q.x+q.w+40&&nx+pl.w>q.x-40)){best=nx;break;}
      }
    }
    if(best!==null){const dx=best-pl.x;pl.x=best;for(const it of its)it.x+=dx;placed.push(pl);}
    else pl.dead=true;   // no safe spot: drop the beam, its items stay reachable with a jump
  }
  L.plats=L.plats.filter(p=>!p.dead);
}

const LB_URL='';   // Firebase Realtime Database (empty = leaderboard hidden)
const LB_ON=!!LB_URL;

const cleanName=s=>(s||'').replace(/[^\p{L}\p{N} _.\-]/gu,'').replace(/\s+/g,' ').trim().slice(0,14);
function fetchT(url,opt,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||7000);return fetch(url,Object.assign({signal:c.signal},opt||{})).finally(()=>clearTimeout(t));}
async function lbSubmit(name,sc){
  const r=await fetchT(LB_URL+'/scores.json',{method:'POST',body:JSON.stringify({name,score:sc,t:Date.now()})});
  if(!r.ok)throw new Error('submit');
  return true;
}
async function lbTop(){
  const r=await fetchT(LB_URL+'/scores.json?orderBy=%22score%22&limitToLast=300');
  if(!r.ok)throw new Error('load');
  const j=(await r.json())||{};
  const best=new Map();
  for(const v of Object.values(j)){
    if(!v||typeof v.name!=='string'||typeof v.score!=='number')continue;
    const k=v.name.toLowerCase();
    if(!best.has(k)||best.get(k).score<v.score)best.set(k,v);
  }
  return [...best.values()].sort((a,b)=>b.score-a.score||(a.t||0)-(b.t||0));
}
function lbRow(rank,v,isMe){
  const li=document.createElement('li');if(isMe)li.className='me';
  const r=document.createElement('span');r.className='r';r.textContent='#'+rank;
  const n=document.createElement('span');n.className='n';n.textContent=v.name;
  const sc=document.createElement('span');sc.className='s';sc.textContent=v.score;
  li.append(r,n,sc);return li;
}
async function showLeaderboard(me,back){
  showCard(`<div class="tag">Class leaderboard</div><h2>🏆 Top players</h2><p class="small" id="lbMsg">Loading…</p><ol class="lb" id="lbList"></ol><div id="lbBtns"><button class="btn" id="bk">${back?'◀ Back':'Play again ↺'}</button></div>`);
  $('#bk').onclick=back||showTitle;
  try{
    if(submitP&&me)await submitP;
    const list=await lbTop();
    const ul=$('#lbList'),msg=$('#lbMsg');
    if(!ul)return;
    if(!list.length){msg.textContent='No scores yet. Be the first!';return;}
    msg.textContent=list.length+(list.length===1?' player':' players');
    const mine=me?list.findIndex(v=>v.name.toLowerCase()===me.name.toLowerCase()):-1;
    list.slice(0,10).forEach((v,i)=>ul.append(lbRow(i+1,v,i===mine)));
    if(mine>=10){const dots=document.createElement('li');dots.textContent='…';ul.append(dots);ul.append(lbRow(mine+1,list[mine],true));}
  }catch(e){
    const msg=$('#lbMsg');if(msg)msg.textContent='Leaderboard not available right now. Check your connection.';
  }
}

/* ================= update ================= */
function die(){
  if(P.inv>0||god&&false)return;
  stats.deaths++;sfx.hit();shakeT=.25;
  for(let i=0;i<10;i++)parts.push({x:P.x+7,y:P.y+13,vx:(Math.random()-.5)*160,vy:-Math.random()*160,l:.6,c:'#e8c46a',k:'sq'});
  P.x=cpX;P.y=GY-P.h;P.vx=0;P.vy=0;P.on=true;P.inv=1.4;
  camX=Math.max(0,Math.min(LV.w-W,P.x-W*.38));
}
function overlap(a,b,m){m=m||0;return a.x+m<b.x+b.w&&a.x+a.w-m>b.x&&a.y+m<b.y+b.h&&a.y+a.h-m>b.y;}
function pick(it){
  it.got=true;
  if(it.k==='heart'){stats.hearts++;weight=Math.max(0,weight-1);sfx.heart();}
  else if(it.k==='coin'){stats.coins++;weight++;sfx.coin();}
  else{stats.items++;sfx.item();}
  const c=it.k==='heart'?'#ff5d78':it.k==='coin'?'#f2c230':'#ffe9a0';
  for(let i=0;i<6;i++)parts.push({x:it.x,y:it.y,vx:(Math.random()-.5)*90,vy:-Math.random()*90,l:.45,c,k:'sq'});
}
function update(dt){
  tAnim+=dt;
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l-=dt;if(q.l<=0){parts.splice(i,1);continue;}q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=(q.k==='up'?-30:400)*dt;}
  if(shakeT>0)shakeT-=dt;
  if(state!=='play'&&state!=='won')return;
  const p=P,can=state==='play';
  const mul=Math.max(.7,1-.04*weight);
  const ax=can?axis():0;
  p.vx+=(ax*SPEED*mul-p.vx)*Math.min(1,dt*16);
  if(Math.abs(ax)>.05)p.dir=ax>0?1:-1;
  coyote=p.on?.09:coyote-dt;
  jumpBuf-=dt;
  if(can&&jumpBuf>0&&coyote>0){p.vy=-JUMP;coyote=0;jumpBuf=0;p.on=false;sfx.jump();}
  if(!jumpHeld&&p.vy<-150)p.vy=-150;
  p.vy=Math.min(560,p.vy+GRAV*dt);
  if(p.inv>0)p.inv-=dt;
  // X movement
  p.x+=p.vx*dt;
  if(p.x<0){p.x=0;p.vx=0;}
  if(p.x>LV.w-p.w){p.x=LV.w-p.w;p.vx=0;}
  for(const g of LV.grounds){
    if(p.x+p.w>g.x&&p.x<g.x+g.w&&p.y+p.h>g.y+2){
      if(p.vx>0)p.x=g.x-p.w;else if(p.vx<0)p.x=g.x+g.w;else if(p.x+p.w/2<g.x+g.w/2)p.x=g.x-p.w;else p.x=g.x+g.w;
      p.vx=0;
    }
  }
  // beams are solid: Pip cannot walk into their side
  for(const pl of LV.plats){
    if(p.x+p.w>pl.x&&p.x<pl.x+pl.w&&p.y+p.h>pl.y+2&&p.y<pl.y+pl.h){
      if(p.vx>0)p.x=pl.x-p.w;else if(p.vx<0)p.x=pl.x+pl.w;else if(p.x+p.w/2<pl.x+pl.w/2)p.x=pl.x-p.w;else p.x=pl.x+pl.w;
      p.vx=0;
    }
  }
  // Y movement
  const pb=p.y+p.h,pt=p.y;
  p.y+=p.vy*dt;p.on=false;
  const nb=p.y+p.h;
  // beams are solid from below: Pip bumps his head instead of passing through
  if(p.vy<0){
    for(const pl of LV.plats){
      if(p.x+p.w>pl.x+1&&p.x<pl.x+pl.w-1&&pt>=pl.y+pl.h-1&&p.y<pl.y+pl.h){p.y=pl.y+pl.h;p.vy=0;}
    }
  }
  if(p.vy>=0){
    for(const g of LV.grounds){
      if(p.x+p.w>g.x+1&&p.x<g.x+g.w-1&&pb<=g.y+2&&nb>=g.y){p.y=g.y-p.h;p.vy=0;p.on=true;}
    }
    for(const pl of LV.plats){
      if(p.x+p.w>pl.x&&p.x<pl.x+pl.w&&pb<=pl.y+2&&nb>=pl.y){p.y=pl.y-p.h;p.vy=0;p.on=true;}
    }
  }
  if(p.y>GY+40){stats.deaths++;sfx.hit();p.inv=0;p.x=cpX;p.y=GY-p.h;p.vx=0;p.vy=0;p.inv=1.4;shakeT=.2;camX=Math.max(0,Math.min(LV.w-W,p.x-W*.38));}
  if(can){
    for(let i=LV.cps.length-1;i>=0;i--){if(p.x>LV.cps[i]&&p.on&&LV.cps[i]>cpX){cpX=LV.cps[i];}}
    // pickups
    for(const it of LV.items){
      if(it.got)continue;
      if(Math.abs(it.x-(p.x+p.w/2))<13&&Math.abs(it.y-(p.y+p.h/2))<18)pick(it);
    }
    // enemies
    for(const e of LV.en){
      if(!e.alive)continue;
      e.x+=e.dir*e.sp*dt;
      if(e.x>=e.x1){e.x=e.x1;e.dir=-1;}
      if(e.x<=e.x0){e.x=e.x0;e.dir=1;}
      if(overlap(p,e,1)){
        if(p.vy>60&&pb<=e.y+7){
          e.alive=false;p.vy=-230;stats.stomps++;sfx.stomp();
          for(let i=0;i<8;i++)parts.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:(Math.random()-.5)*140,vy:-Math.random()*120,l:.5,c:'#cfc8d8',k:'sq'});
        }else if(p.inv<=0&&!god)die();
      }
    }
    // hazards
    if(p.inv<=0&&!god){for(const h of LV.haz){if(overlap(p,{x:h.x+2,y:h.y+3,w:h.w-4,h:h.h-3},1)){die();break;}}}
    // goal
    if(p.x+p.w>=LV.goalX){state='won';winT=lvIdx===4?1.8:.9;sfx.win();}
  }else{
    winT-=dt;
    if(winT<=0){showQuiz(lvIdx);}
  }
  // camera
  const tx=Math.max(0,Math.min(LV.w-W,p.x-W*.38));
  camX+=(tx-camX)*Math.min(1,dt*6);
}

/* ================= drawing ================= */
function skyGrad(T){const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,T.sky[0]);g.addColorStop(1,T.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function drawBg(L,cx){
  const T=L.T;skyGrad(T);
  const th=L.theme;
  if(th==='marsh'||th==='home'){
    ctx.fillStyle=th==='marsh'?'rgba(235,240,225,.65)':'rgba(255,248,200,.95)';
    ctx.beginPath();ctx.arc(520,130,th==='marsh'?20:26,0,7);ctx.fill();
  }
  if(th==='thames'){
    for(const s of L.stars){ctx.globalAlpha=.4+.6*Math.abs(Math.sin(tAnim*1.5+s.s*9));R(s.x,s.y,1,1,'#fff');}
    ctx.globalAlpha=1;
    ctx.fillStyle='#e9ecff';ctx.beginPath();ctx.arc(500,130,18,0,7);ctx.fill();
    ctx.fillStyle=T.sky[0];ctx.beginPath();ctx.arc(508,125,16,0,7);ctx.fill();
  }
  // far layer
  const fx=cx*.3;
  for(const b of L.far){
    const sx=b.x-fx;if(sx>W+10||sx+b.w<-10)continue;
    if(th==='marsh'||th==='home'){ctx.fillStyle=T.far;ctx.beginPath();ctx.ellipse(sx+b.w/2,GY,b.w/2+10,b.h*.8,0,Math.PI,0);ctx.fill();}
    else if(th==='satis'){R(sx,60,34,100,'#17101f');R(sx+3,63,28,94,'#3a3a68');R(sx+3,63,28,10,'#5b5b92');R(sx+16,63,2,94,'#17101f');R(sx+3,108,28,2,'#17101f');}
    else if(th==='london'){const bh=b.h*2;R(sx,GY-bh,b.w,bh,T.far);const seedB=Math.floor(b.r*997);for(let j=0,wy=GY-bh+8;wy<GY-14;wy+=14,j++)for(let i=0,wx=sx+6;wx<sx+b.w-8;wx+=14,i++)R(wx,wy,5,7,((i*7+j*13+seedB)%3===0)?'#ffe08a':'#6e3f36');}
    else if(th==='thames'){const bh=b.h*1.4;R(sx,GY-bh,b.w,bh,T.far);R(sx,GY-bh,b.w,3,'#223559');for(let wx=sx+6;wx<sx+b.w-8;wx+=16)R(wx,GY-bh+14,6,8,(b.r>.5)?'#ffd77a':'#2b3f6a');}
  }
  if(th==='satis'){
    const cxs=cx*.5;
    for(let k=0;k<30;k++){
      const sx=k*210+80-cxs;if(sx<-30||sx>W+30)continue;
      ctx.fillStyle='#c9b27a';ctx.beginPath();ctx.arc(sx,150,17,0,7);ctx.fill();
      ctx.fillStyle='#efe3c0';ctx.beginPath();ctx.arc(sx,150,14,0,7);ctx.fill();
      ctx.strokeStyle='#1a1420';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(sx,150);ctx.lineTo(sx+Math.cos((40/60)*Math.PI*2-Math.PI/2)*12,150+Math.sin((40/60)*Math.PI*2-Math.PI/2)*12);ctx.stroke();
      const ha=(8+40/60)/12*Math.PI*2-Math.PI/2;
      ctx.beginPath();ctx.moveTo(sx,150);ctx.lineTo(sx+Math.cos(ha)*8,150+Math.sin(ha)*8);ctx.stroke();
    }
  }
  // near layer
  const nx=cx*.6;
  for(const b of L.near){
    const sx=b.x-nx;if(sx>W+10||sx+b.w<-10)continue;
    if(th==='marsh'){ctx.fillStyle=T.near;for(let k=0;k<3;k++)R(sx+k*7,GY-b.h*.8+k*5,2,b.h*.8-k*5,T.near);}
    else if(th==='home'){R(sx+b.w/2-2,GY-b.h*.6,4,b.h*.6,'#5a3e28');ctx.fillStyle=T.near;ctx.beginPath();ctx.arc(sx+b.w/2,GY-b.h*.6,b.h*.45+6,0,7);ctx.fill();}
    else if(th==='satis'){R(sx,GY-b.h*.8,b.w,b.h*.8,T.near);R(sx,GY-b.h*.8,b.w,3,'#34283c');if(b.r>.6)R(sx+b.w/2-1,GY-b.h*.8-18,2,18,'#3a2c44');}
    else if(th==='london'){if(b.r>.55){R(sx+b.w/2,GY-60,2,60,'#2a2a30');R(sx+b.w/2-4,GY-66,10,6,'#ffe08a');}else R(sx,GY-b.h,b.w,b.h,T.near);}
    else if(th==='thames'){R(sx,GY-b.h*.7,b.w,b.h*.7,T.near);R(sx,GY-b.h*.7,b.w,2,'#1d3055');}
  }
  if(th==='marsh'){ctx.fillStyle='rgba(235,240,230,.14)';const o=(tAnim*12)%W;ctx.fillRect(0,220,W,50);ctx.fillStyle='rgba(235,240,230,.1)';ctx.fillRect(-o,250,W*2,30);}
  // pit fill
  R(0,GY,W,H-GY,T.pit);
  if(th==='thames'){
    for(let wx=-20;wx<W+20;wx+=22){const wy=GY+14+Math.sin(tAnim*2+wx*.1)*2;R(wx+((tAnim*14)%22),wy,12,2,'#2d5a96');}
  }
}
function drawProp(pr,sx){
  if(pr.t==='tree'){R(sx-3,GY-34,6,34,'#5a3e28');ctx.fillStyle='#4e8c4e';ctx.beginPath();ctx.arc(sx,GY-42,22,0,7);ctx.fill();ctx.fillStyle='#5aa05a';ctx.beginPath();ctx.arc(sx-7,GY-48,12,0,7);ctx.fill();}
  else if(pr.t==='cottage'||pr.t==='forge'){
    const f=pr.t==='forge';R(sx-34,GY-48,68,48,f?'#9a8a78':'#d9b87a');

    R(sx-8,GY-30,16,30,'#5a3a22');R(sx-26,GY-38,12,12,f?'#ffb04a':'#8fc0e0');R(sx+14,GY-38,12,12,f?'#ffb04a':'#8fc0e0');
    if(f){R(sx+22,GY-86,10,16,'#6a5a50');R(sx+36,GY-12,18,5,'#2a2a30');R(sx+40,GY-7,10,7,'#2a2a30');}
  }
  else if(pr.t==='pillar'){R(sx-8,GY-pr.h,16,pr.h,'#cfc8b8');R(sx-10,GY-pr.h-3,20,4,'#e0dac9');R(sx-3,GY-pr.h-8,6,6,'#cfc8b8');R(sx+2,GY-pr.h*.5,2,pr.h*.5,'#b4ad9c');}
  else if(pr.t==='arch'){R(sx-34,GY-90,14,90,'#cfc8b8');R(sx+20,GY-62,14,62,'#cfc8b8');R(sx-34,GY-96,34,8,'#e0dac9');R(sx-12,GY-92,6,6,'#cfc8b8');}
}
function drawGround(L,cx){
  const T=L.T;
  for(const g of L.grounds){

  }
  for(const pl of L.plats){
    const sx=pl.x-cx;if(sx>W||sx+pl.w<0)continue;

}
function drawHaz(L,cx){
  for(const h of L.haz){
    const sx=h.x-cx;if(sx>W||sx+h.w<0)continue;
    ctx.fillStyle=L.T.haz;
    for(let x=0;x<h.w;x+=8){ctx.beginPath();ctx.moveTo(sx+x,GY);ctx.lineTo(sx+x+4,GY-13);ctx.lineTo(sx+x+8,GY);ctx.closePath();ctx.fill();}

}
function person(x,y,dir,moving,o){
  const w=o.w||14,f=dir>0?1:-1,bob=moving?(Math.floor(tAnim*10)%2):0;
  const hx=x+(w-8)/2;
  if(o.dress){
    R(x+1,y+10,w-2,15,o.dress);R(x,y+22,w,4,o.hem||o.dress);

    R(x+2,y+19,4,7-bob,o.legs||'#2b2433');R(x+w-6,y+19,4,6+bob,o.legs||'#2b2433');
    R(x+1,y+9,w-2,11,o.top);
    if(o.apron)R(x+3,y+12,w-6,11,o.apron);

    R(x-1,y+17,2,2,o.skin||'#f0c9a0');R(x+w-1,y+17,2,2,o.skin||'#f0c9a0');
  }
  if(o.dress){R(x-1,y+10,2,8,o.dress);R(x+w-1,y+10,2,8,o.dress);}
  R(hx,y+1,8,8,o.skin||'#f0c9a0');
  R(hx,y,8,3,o.hair||'#5a3a22');
  if(f>0)R(hx,y+3,2,5,o.hair||'#5a3a22');else R(hx+6,y+3,2,5,o.hair||'#5a3a22');
  R(hx+(f>0?5:2),y+4,1,2,'#1a1420');
  if(o.hat){R(hx-2,y-1,12,2,o.hat);R(hx+0,y-8,8,8,o.hat);R(hx,y-4,8,1,'#c9a227');}
  if(o.bun){R(hx+(f>0?-2:7),y-1,3,3,o.hair||'#3a2a20');}
  if(o.veil){R(hx-1,y,10,2,'#f1ead2');R(x+(f>0?-4:w),y+2,5,20,'rgba(241,234,210,.75)');}

function drawPlayer(){
  if(P.inv>0&&Math.floor(P.inv*14)%2===0)return;
  const lk=pipLook(lvIdx);
  person(P.x,P.y,P.dir,Math.abs(P.vx)>10&&P.on,Object.assign({},lk));
}
function drawNpc(n,sx){
  const base=GY-26;
  const look={
    magwitch:{top:'#6b6b72',legs:'#3a3a40',hair:'#a8a8b0',w:14},
    havisham:{dress:'#e8dcc0',hem:'#c8bb98',hair:'#d9d4cc',veil:true,w:16},
    estella:{dress:'#4a6fb0',hem:'#3a5890',hair:'#2a1c14',bun:true,w:14},
    jaggers:{top:'#222230',legs:'#15151c',hair:'#33261a',w:14,hat:'#14121a'},
    herbert:{top:'#8a5a2a',legs:'#33261a',hair:'#d9b36a',w:14},
    joe:{top:'#a84a2a',legs:'#33291c',hair:'#6a4a2a',apron:'#d9d2c0',w:20}
  }[n.k];
  const dirToP=(P.x+7<n.x)?-1:1;
  person(sx-(look.w||14)/2,base,dirToP,false,look);
  if(Math.abs(P.x-n.x)<125&&(state==='play'||state==='won'))bubble(sx,base-(look.hat?10:4),n.lines);
}
function bubble(cx,topY,lines){
  ctx.font='bold 11px Georgia';
  let w=0;for(const l of lines)w=Math.max(w,ctx.measureText(l).width);
  w=Math.ceil(w)+14;const h=lines.length*13+8;
  let x=Math.round(cx-w/2);const y=Math.round(topY-h-8);
  x=Math.max(4,Math.min(W-w-4,x));
  ctx.fillStyle='#1a1420';ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.fillStyle='#f4ead2';ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#f4ead2';ctx.beginPath();ctx.moveTo(cx-4,y+h);ctx.lineTo(cx+4,y+h);ctx.lineTo(cx,y+h+6);ctx.closePath();ctx.fill();
  ctx.fillStyle='#1a1420';ctx.textBaseline='alphabetic';
  lines.forEach((l,i)=>ctx.fillText(l,x+7,y+13+i*13));
}
function heartShape(x,y,c){R(x+1,y,3,2,c);R(x+5,y,3,2,c);R(x,y+1,9,3,c);R(x+1,y+4,7,2,c);R(x+2,y+6,5,1,c);R(x+3,y+7,3,1,c);}
function drawItems(L,cx){
  for(const it of L.items){
    if(it.got)continue;const sx=it.x-cx;if(sx<-12||sx>W+12)continue;
    const by=it.y+Math.sin(tAnim*3+it.x*.05)*2;
    if(it.k==='heart'){heartShape(sx-4,by-4,'#ff5d78');R(sx-3,by-3,2,1,'#ffc2cc');}
    else if(it.k==='coin'){ctx.fillStyle='#b8870f';ctx.beginPath();ctx.arc(sx,by,6,0,7);ctx.fill();ctx.fillStyle='#f2c230';ctx.beginPath();ctx.arc(sx,by,4.5,0,7);ctx.fill();R(sx-1,by-3,2,6,'#b8870f');}
    else if(L.theme==='marsh'){R(sx-6,by-3,12,7,'#c98a4a');R(sx-6,by-3,12,2,'#e2a964');R(sx-3,by-1,6,1,'#a46a30');}
    else if(L.theme==='satis'){ctx.strokeStyle='#e8c46a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(sx,by+2,4,0,7);ctx.stroke();R(sx-1,by-5,2,3,'#e8c46a');R(sx,by+0,1,3,'#e8c46a');}
    else{R(sx-3,by-5,6,10,'#7a4a1a');R(sx-2,by-4,4,8,'#ffcf5a');R(sx-3,by-6,6,1,'#c9a227');}
  }
}
function drawEnemy(e,cx){
  if(!e.alive)return;const sx=e.x-cx;if(sx<-20||sx>W+20)return;
  const step=Math.floor(tAnim*8)%2;
  if(e.k==='crow'){
    R(sx,e.y+2,12,8,'#15121a');R(sx+2,e.y,6,3,'#15121a');
    R(sx+(e.dir>0?12:-3),e.y+4,3,2,'#e6a040');R(sx+(e.dir>0?8:3),e.y+3,1,1,'#fff');

  }else if(e.k==='rat'){
    R(sx,e.y+2,13,6,'#7d7480');R(sx+(e.dir>0?9:0),e.y,5,5,'#8c8392');
    R(sx+(e.dir>0?13:-2),e.y+3,2,2,'#e58');R(sx+(e.dir>0?-5:13),e.y+6,5,1,'#c98');

  }else{

}
function drawGoal(L,cx){
  const sx=L.goalX-cx;if(sx<-60||sx>W+60)return;

  else if(g==='door'){R(sx-4,GY-62,34,62,'#8c8c98');R(sx,GY-56,26,56,'#3a2418');R(sx+3,GY-52,20,22,'#5a3a24');R(sx+3,GY-26,20,26,'#5a3a24');R(sx+19,GY-28,3,3,'#ffd24a');R(sx-6,GY-66,38,5,'#6e6e7a');}
  else if(g==='boat'){R(sx-14,GY-12,64,12,'#6b3f1e');R(sx-18,GY-16,72,5,'#8a5a2c');R(sx+16,GY-56,3,44,'#5a3a22');ctx.fillStyle='#e8e0cc';ctx.beginPath();ctx.moveTo(sx+19,GY-54);ctx.lineTo(sx+46,GY-20);ctx.lineTo(sx+19,GY-20);ctx.closePath();ctx.fill();R(sx-6,GY-24,4,10,'#ffcf5a');}
}
function hud(){
  ctx.font='bold 12px Georgia';ctx.textBaseline='top';
  const sh=(t,x,y,c)=>{ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillText(t,x+1,y+1);ctx.fillStyle=c||'#f4ead2';ctx.fillText(t,x,y);};

  ctx.restore();

  const pr=Math.max(0,Math.min(1,P.x/LV.goalX));

}
function drawControls(){
  const act=stick.id!==null;
  ctx.globalAlpha=act?.35:.18;
  const bx=act?stick.ox:46+SAFE_L,by=act?stick.oy:226;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,38,0,7);ctx.fill();
  ctx.globalAlpha=act?.6:.25;

  const jx=W-46-SAFE_R;ctx.globalAlpha=jumpHeld?.45:.2;ctx.beginPath();ctx.arc(jx,226,36,0,7);ctx.fill();
  ctx.globalAlpha=.8;ctx.fillStyle='#1a1420';ctx.font='bold 13px Georgia';ctx.textBaseline='middle';ctx.textAlign='center';ctx.fillText('JUMP',jx,226);
  ctx.textAlign='left';ctx.globalAlpha=1;

function drawParts(cx){for(const q of parts){ctx.globalAlpha=Math.max(0,Math.min(1,q.l*2));R(q.x-cx,q.y,3,3,q.c);}ctx.globalAlpha=1;}
function drawPlay(){
  let ox=0,oy=0;if(shakeT>0){ox=(Math.random()-.5)*4;oy=(Math.random()-.5)*4;}
  ctx.save();ctx.translate(ox,oy-OFF);
  const cx=Math.round(camX);
  drawBg(LV,cx);
  for(const pr of LV.props)drawProp(pr,pr.x-cx);
  drawGround(LV,cx);drawHaz(LV,cx);drawGoal(LV,cx);
  for(const n of LV.npcs){const sx=n.x-cx;if(sx>-40&&sx<W+40)drawNpc(n,sx);}
  drawItems(LV,cx);
  for(const e of LV.en)drawEnemy(e,cx);
  const savedX=P.x;P.x=P.x-cx;drawPlayer();P.x=savedX;
  drawParts(cx);
  ctx.restore();
  hud();
  if(state==='play')drawControls();
}
function drawTitleBg(){
  const L=buildLevel(DEFS[0]);
  drawBg(L,0);
  for(const pr of L.props)drawProp(pr,pr.x);
  drawGround(L,0);
  person(280,GY-26,1,false,Object.assign({},pipLook(0)));
}
function drawEnd(){
  const cx=W/2;
  const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,'#f2a65a');g.addColorStop(.6,'#fbd28a');g.addColorStop(1,'#fdeab4');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#9a6a58';
  for(const [hx,rx,ry] of [[cx-200,230,70],[cx+220,260,90],[-20,200,60],[W+20,200,80]]){ctx.beginPath();ctx.ellipse(hx,GY,rx,ry,0,Math.PI,0);ctx.fill();}
  drawProp({t:'pillar',h:70},cx-230);drawProp({t:'pillar',h:46},cx-170);drawProp({t:'arch'},cx+150);drawProp({t:'pillar',h:60},cx+240);
  R(0,GY,W,H-GY,'#6a8a4a');R(0,GY,W,5,'#86b05c');
  for(let x=0;x<W;x+=30)R(x+8,GY+14+((x/30|0)%3)*8,10,3,'rgba(0,0,0,.14)');
  const bx=cx-28+Math.sin(tAnim*.8)*1;
  person(bx,GY-26,1,false,{top:'#4f7ab0',legs:'#3c3226',hair:'#5a3a22'});
  person(bx+20,GY-26,-1,false,{dress:'#4a6fb0',hem:'#3a5890',hair:'#2a1c14',bun:true});
  R(bx+13,GY-12,8,2,'#f0c9a0');
}
function drawEndParts(){
  if(Math.random()<.08)parts.push({x:W/2-140+Math.random()*280,y:GY-30,vx:(Math.random()-.5)*20,vy:-30-Math.random()*30,l:2.6,c:'#ff5d78',k:'up'});
  for(const q of parts){ctx.globalAlpha=Math.min(1,q.l);heartShape(q.x,q.y,q.c);}
  ctx.globalAlpha=1;
}

/* ================= main loop ================= */
let last=0,acc=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;acc+=dt;
  while(acc>=1/60){update(1/60);acc-=1/60;}
  ctx.setTransform(S,0,0,S,0,0);ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,VH);
  if(state==='play'||state==='won'||state==='story'&&LV||state==='quiz'&&LV){
    if(state==='story'||state==='quiz'){/* keep last frame frozen look */}
    drawPlay();
  }else if(state==='end'){ctx.save();ctx.translate(0,-OFF);drawEnd();drawEndParts();ctx.restore();}
  else{ctx.save();ctx.translate(0,-OFF);drawTitleBg();ctx.restore();}
  requestAnimationFrame(frame);
}

/* ================= start ================= */
const qs=new URLSearchParams(location.search);
god=qs.get('god')==='1';
showTitle();
const startLv=qs.get('l');
if(startLv!==null&&DEFS[+startLv]){loadLevel(+startLv);}
if(qs.get('end')==='1'){showEnd();}
requestAnimationFrame(frame);
window.__g={get state(){return state;},get P(){return P;},get LV(){return LV;},keys,setGod:v=>{god=v;},loadLevel,showQuiz,get stats(){return stats;},get cpX(){return cpX;}};
})();
</script>
